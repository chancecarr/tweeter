  postUpdateFeedMessages:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: postUpdateFeedMessages
      Handler: lambda/status/PostUpdateFeedMessagesLambda.handler
      Policies: *commonPolicies
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt postStatusQueue.Arn
            Enabled: true

  updateFeeds:
