                      method.response.header.Access-Control-Allow-Origin: '''*'''
                  .*bad-request.*:
                    statusCode: 400
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: '''*'''
                    responseTemplates:
                      application/json: '{ "error": "$input.path(''$.errorMessage'')"
                        }'
                  .*unauthorized.*:
                    statusCode: 401
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: '''*'''
                    responseTemplates:
                      application/json: '{ "error": "$input.path(''$.errorMessage'')"
                        }'
                  .*internal-server-error.*:
                    statusCode: 500
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: '''*'''
                    responseTemplates:
                      application/json: '{ "error": "$input.path(''$.errorMessage'')"
                        }'
              responses:
